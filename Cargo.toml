[package]
edition = "2021"
name = "obs-spotify-bridge"
version = "0.3.0"

[dependencies]
clap = { version = "4.6.6", features = ["env", "derive"] }
itertools = "0.15.0"
obws = "0.15.0"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
spotnowplay = { git = "https://github.com/yanorei32/spotnowplay", tag = "v0.1.1" }
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
